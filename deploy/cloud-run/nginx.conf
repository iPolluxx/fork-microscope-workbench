worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "no-cache" always;
        # Deliberately do not impose upgrade-insecure-requests: SSH/local workers use loopback HTTP.
        location / { try_files $uri $uri/ =404; }
        location /api/ { return 404; }
        location ~ /\. { return 404; }
        # Cloud Run's public frontend may reserve /healthz before nginx sees it.
        # Keep the dashboard's public readiness check on an ordinary route.
        location = /fork-microscope-ready { access_log off; default_type text/plain; return 200 "ok\n"; }
    }
}
